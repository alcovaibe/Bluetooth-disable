name: Import disguise icons

on:
  push:
    branches:
      - assets/disguise-icons

permissions:
  contents: write

jobs:
  import-icons:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: assets/disguise-icons

      - name: Reconstruct WebP icons
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          source = Path('.icon-import')
          target = Path('app/src/main/res/drawable')
          target.mkdir(parents=True, exist_ok=True)

          icons = {
              'calculator': ('ic_disguise_calculator.webp', 7784),
              'notes': ('ic_disguise_notes.webp', 11112),
              'calendar': ('ic_disguise_calendar.webp', 10200),
              'gallery': ('ic_disguise_gallery.webp', 11694),
          }

          for key, (filename, expected_size) in icons.items():
              parts = sorted(source.glob(f'{key}.*.part'))
              if not parts:
                  raise SystemExit(f'Missing chunks for {key}')

              encoded = ''.join(part.read_text(encoding='utf-8').strip() for part in parts)
              data = base64.b64decode(encoded, validate=True)

              if len(data) != expected_size:
                  raise SystemExit(
                      f'{key}: expected {expected_size} bytes, got {len(data)}'
                  )
              if data[:4] != b'RIFF' or data[8:12] != b'WEBP':
                  raise SystemExit(f'{key}: reconstructed file is not WebP')

              (target / filename).write_bytes(data)
              print(f'{filename}: {len(data)} bytes')
          PY

      - name: Commit icon assets
        shell: bash
        run: |
          git rm -r .icon-import
          git rm .github/workflows/import-disguise-icons.yml
          git add app/src/main/res/drawable/ic_disguise_*.webp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add disguise launcher icons"
          git push origin HEAD:assets/disguise-icons
