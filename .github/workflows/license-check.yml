name: License Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  license-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Resolve runtime dependencies with current Gradle and AGP
        shell: bash
        run: |
          mkdir -p build/reports/dependencies
          ./gradlew --version
          ./gradlew :app:dependencies \
            --configuration releaseRuntimeClasspath \
            --console=plain | tee build/reports/dependencies/releaseRuntimeClasspath.txt

      - name: Audit dependency licenses
        uses: actions/dependency-review-action@v4
        with:
          license-check: true
          vulnerability-check: false

      - name: Upload resolved dependency tree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-tree
          path: build/reports/dependencies/releaseRuntimeClasspath.txt
          if-no-files-found: error
